name: Feature request
description: Suggest something Mirai should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: >
        Describe the situation, not the solution. The best feature requests
        explain a moment where the app got in your way.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you have already tried
      description: Settings, a different rig, a different persona, a code change.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I have read the Roadmap in the README and this is not already listed
          required: true
