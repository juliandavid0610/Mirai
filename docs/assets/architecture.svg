<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 780" width="1240" height="780" role="img" aria-label="Mirai pipeline diagram: a model reply is split into transcript text, emotion cues and speech audio, which all rejoin at a single Cubism parameter write once per frame.">
  <title>How one reply becomes a rendered frame</title>
  <desc>The text lane runs from the composer through /api/chat and streamText to a streaming directive parser. The parser emits emotion cues into the expression lane, clean text into the transcript, and the reply text into the voice lane, where speech audio is analysed for loudness. The expression and voice lanes converge on ParameterWriter, which writes Cubism parameters inside the beforeModelUpdate hook, and the frame is rendered by PixiJS.</desc>

  <defs>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171132"/><stop offset="1" stop-color="#0b0a12"/>
    </linearGradient>

    <marker id="mv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/>
    </marker>
    <marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/>
    </marker>
    <marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0ea5e9"/>
    </marker>
    <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b6392"/>
    </marker>
  </defs>

  <rect width="1240" height="780" rx="24" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1239" height="779" rx="24" fill="none" stroke="#2a2440"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="44" y="56" fill="#ece9f6" font-size="23" font-weight="700">How one reply becomes a rendered frame</text>
    <text x="44" y="82" fill="#8b83a8" font-size="14">Three lanes leave the same stream and rejoin at a single parameter write, once per frame.</text>

    <!-- lane rules -->
    <g stroke="#221d38">
      <line x1="44" y1="136" x2="1196" y2="136"/>
      <line x1="44" y1="336" x2="1196" y2="336"/>
      <line x1="44" y1="476" x2="1196" y2="476"/>
      <line x1="44" y1="626" x2="1196" y2="626"/>
    </g>
    <g font-size="11" font-weight="700" letter-spacing="1.4">
      <text x="44" y="126" fill="#a78bfa">TEXT</text>
      <text x="44" y="326" fill="#fbbf24">EXPRESSION</text>
      <text x="44" y="466" fill="#22d3ee">VOICE</text>
      <text x="44" y="616" fill="#8b83a8">FRAME</text>
    </g>

    <!-- ════ TEXT ═══════════════════════════════════════════════════════ -->
    <g>
      <rect x="44" y="156" width="176" height="62" rx="12" fill="#151030" stroke="#3a3260"/>
      <text x="132" y="182" fill="#ece9f6" font-size="14" font-weight="600" text-anchor="middle">You type or speak</text>
      <text x="132" y="201" fill="#8b83a8" font-size="11.5" text-anchor="middle">composer · microphone</text>

      <rect x="272" y="156" width="192" height="62" rx="12" fill="#151030" stroke="#3a3260"/>
      <text x="368" y="182" fill="#ece9f6" font-size="14" font-weight="600" text-anchor="middle">POST /api/chat</text>
      <text x="368" y="201" fill="#8b83a8" font-size="11.5" text-anchor="middle">persona · memory · model</text>

      <rect x="516" y="156" width="204" height="62" rx="12" fill="#151030" stroke="#3a3260"/>
      <text x="618" y="182" fill="#ece9f6" font-size="14" font-weight="600" text-anchor="middle">streamText</text>
      <text x="618" y="201" fill="#8b83a8" font-size="11.5" text-anchor="middle">AI SDK · Vercel AI Gateway</text>

      <rect x="772" y="156" width="192" height="62" rx="12" fill="#151030" stroke="#3a3260"/>
      <text x="868" y="182" fill="#ece9f6" font-size="14" font-weight="600" text-anchor="middle">UIMessage stream</text>
      <text x="868" y="201" fill="#8b83a8" font-size="11.5" text-anchor="middle">SSE · word-chunked</text>

      <rect x="1016" y="156" width="180" height="62" rx="12" fill="#1c1540" stroke="#6a57c4"/>
      <text x="1106" y="182" fill="#ece9f6" font-size="14" font-weight="600" text-anchor="middle">parseDirectives()</text>
      <text x="1106" y="201" fill="#a78bfa" font-size="11.5" text-anchor="middle">safe on partial text</text>

      <g stroke="url(#violet)" stroke-width="2" fill="none" marker-end="url(#mv)">
        <line x1="222" y1="187" x2="266" y2="187"/>
        <line x1="466" y1="187" x2="510" y2="187"/>
        <line x1="722" y1="187" x2="766" y2="187"/>
        <line x1="966" y1="187" x2="1010" y2="187"/>
      </g>
    </g>

    <!-- ════ the three-way split ════════════════════════════════════════ -->
    <g fill="none" stroke-width="2">
      <path d="M1106 220 V244 H236 V350" stroke="url(#amber)" marker-end="url(#ma)"/>
      <path d="M1106 220 V266 H648 V350" stroke="#6b6392" marker-end="url(#mg)"/>
      <path d="M1106 220 V288 H926 V490" stroke="url(#cyan)" marker-end="url(#mc)"/>
    </g>
    <g font-size="11.5">
      <text x="252" y="240" fill="#fbbf24">EmotionCue[] — emotion + intensity + offset</text>
      <text x="664" y="262" fill="#8b83a8">clean text</text>
      <text x="942" y="284" fill="#22d3ee">reply text</text>
    </g>

    <!-- ════ EXPRESSION ═════════════════════════════════════════════════ -->
    <g>
      <rect x="146" y="356" width="180" height="62" rx="12" fill="#2a1e0a" stroke="#7a5d18"/>
      <text x="236" y="382" fill="#ece9f6" font-size="14" font-weight="600" text-anchor="middle">Expression file</text>
      <text x="236" y="401" fill="#cba652" font-size="11.5" text-anchor="middle">when the rig ships one</text>

      <rect x="366" y="356" width="196" height="62" rx="12" fill="#2a1e0a" stroke="#7a5d18"/>
      <text x="464" y="382" fill="#ece9f6" font-size="14" font-weight="600" text-anchor="middle">Pose blend</text>
      <text x="464" y="401" fill="#cba652" font-size="11.5" text-anchor="middle">brows · eyes · head tilt</text>

      <rect x="612" y="356" width="180" height="62" rx="12" fill="#151030" stroke="#3a3260"/>
      <text x="702" y="382" fill="#ece9f6" font-size="14" font-weight="600" text-anchor="middle">Transcript</text>
      <text x="702" y="401" fill="#8b83a8" font-size="11.5" text-anchor="middle">what you read</text>

      <line x1="330" y1="387" x2="360" y2="387" stroke="url(#amber)" stroke-width="2" marker-end="url(#ma)"/>
      <text x="836" y="392" fill="#5b5480" font-size="11.5">rigs without expression files fall back to the pose blend alone</text>
    </g>

    <!-- ════ VOICE ══════════════════════════════════════════════════════ -->
    <g>
      <rect x="836" y="496" width="180" height="62" rx="12" fill="#07283a" stroke="#186c8a"/>
      <text x="926" y="522" fill="#ece9f6" font-size="14" font-weight="600" text-anchor="middle">POST /api/speech</text>
      <text x="926" y="541" fill="#5fc6e4" font-size="11.5" text-anchor="middle">neural TTS → audio bytes</text>

      <rect x="596" y="496" width="196" height="62" rx="12" fill="#07283a" stroke="#186c8a"/>
      <text x="694" y="522" fill="#ece9f6" font-size="14" font-weight="600" text-anchor="middle">AnalyserNode</text>
      <text x="694" y="541" fill="#5fc6e4" font-size="11.5" text-anchor="middle">RMS, every frame</text>

      <rect x="356" y="496" width="196" height="62" rx="12" fill="#07283a" stroke="#186c8a"/>
      <text x="454" y="522" fill="#ece9f6" font-size="14" font-weight="600" text-anchor="middle">LipSyncDriver</text>
      <text x="454" y="541" fill="#5fc6e4" font-size="11.5" text-anchor="middle">gate · asymmetric damping</text>

      <g stroke="url(#cyan)" stroke-width="2" fill="none" marker-end="url(#mc)">
        <line x1="832" y1="527" x2="798" y2="527"/>
        <line x1="592" y1="527" x2="558" y2="527"/>
      </g>

      <text x="926" y="578" text-anchor="end" fill="#5b6a86" font-size="11.5">browser speech exposes no audio — the envelope is estimated from the text</text>
      <path d="M926 558 V594 H466" fill="none" stroke="#2e4e63" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#mc)"/>
    </g>

    <!-- ════ convergence ════════════════════════════════════════════════ -->
    <g fill="none" stroke-width="2">
      <path d="M464 418 V444 H196 V640" stroke="url(#amber)" marker-end="url(#ma)"/>
      <path d="M454 558 V640" stroke="url(#cyan)" marker-end="url(#mc)"/>
    </g>

    <!-- ════ FRAME ══════════════════════════════════════════════════════ -->
    <g>
      <rect x="86" y="646" width="380" height="66" rx="12" fill="#1c1540" stroke="#6a57c4"/>
      <text x="276" y="673" fill="#ece9f6" font-size="14" font-weight="600" text-anchor="middle">ParameterWriter · beforeModelUpdate</text>
      <text x="276" y="693" fill="#a78bfa" font-size="11.5" text-anchor="middle">set · add · multiply, per semantic slot</text>

      <rect x="546" y="646" width="230" height="66" rx="12" fill="#151030" stroke="#3a3260"/>
      <text x="661" y="673" fill="#ece9f6" font-size="14" font-weight="600" text-anchor="middle">coreModel.update()</text>
      <text x="661" y="693" fill="#8b83a8" font-size="11.5" text-anchor="middle">Cubism 2 or 4</text>

      <rect x="856" y="646" width="300" height="66" rx="12" fill="#151030" stroke="#3a3260"/>
      <text x="1006" y="673" fill="#ece9f6" font-size="14" font-weight="600" text-anchor="middle">PixiJS · WebGL canvas</text>
      <text x="1006" y="693" fill="#8b83a8" font-size="11.5" text-anchor="middle">one shared ticker</text>

      <g stroke="url(#violet)" stroke-width="2" fill="none" marker-end="url(#mv)">
        <line x1="470" y1="679" x2="540" y2="679"/>
        <line x1="780" y1="679" x2="850" y2="679"/>
      </g>
    </g>

    <text x="44" y="752" fill="#4e4870" font-size="11.5">The order matters: motion → expression → physics → beforeModelUpdate → update(). Writing anywhere earlier gets overwritten the moment a motion plays.</text>
  </g>
</svg>
