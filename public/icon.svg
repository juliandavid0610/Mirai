<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Mirai">
  <title>Mirai</title>
  <defs>
    <!-- Bright by default: the mark sits on browser tab bars and gallery
         cards that are usually light, so a dark tile disappears there. -->
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.45" stop-color="#e879f9"/>
      <stop offset="1" stop-color="#38e0f0"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.3" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#tile)"/>
  <rect width="64" height="64" rx="16" fill="url(#gloss)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="url(#rim)" stroke-width="1.5"/>

  <!-- A face, not a sparkle. This is a companion app, and two eyes and a
       smile read instantly at 16px where an abstract glyph does not. -->
  <g fill="#ffffff">
    <ellipse cx="23.5" cy="28" rx="4.6" ry="5.4"/>
    <ellipse cx="40.5" cy="28" rx="4.6" ry="5.4"/>
  </g>
  <g fill="#7c3aed" opacity="0.5">
    <circle cx="25.1" cy="26.2" r="1.5"/>
    <circle cx="42.1" cy="26.2" r="1.5"/>
  </g>

  <path d="M23 41.5c2.7 3.3 6 5 9 5s6.3-1.7 9-5"
        fill="none" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round"/>

  <!-- Blush, barely there — warms the mark without muddying it at small sizes. -->
  <g fill="#ffffff" opacity="0.32">
    <ellipse cx="15.5" cy="37.5" rx="4" ry="2.6"/>
    <ellipse cx="48.5" cy="37.5" rx="4" ry="2.6"/>
  </g>
</svg>
